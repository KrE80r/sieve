name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # Fallback for missed push events; FeedSieve publishes near the top of the hour.
    - cron: "20 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # FeedSieve publishes both snapshots in one commit. A newer snapshot can
  # replace even a deployment stuck waiting for its environment.
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: https://sieve.nazmy.io/
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test static site
        run: node --test tests/*.test.mjs

      - name: Prepare static site
        run: |
          mkdir -p _site
          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name .github \
            ! -name _site \
            -exec cp -a -t _site {} +

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify public snapshots advanced
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const expected = JSON.parse(readFileSync('data/mobile/v1/articles.json'));
          for (let attempt = 0; attempt < 12; attempt++) {
            try {
              const snapshots = await Promise.all(['feed.json', 'mobile/v1/articles.json'].map(async path => {
                const response = await fetch(`https://sieve.nazmy.io/data/${path}?verify=${process.env.GITHUB_SHA}-${attempt}`, {
                  signal: AbortSignal.timeout(10000),
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return response.json();
              }));
              const [feed, mobile] = snapshots;
              if (mobile.sequence >= expected.sequence && mobile.complete &&
                  Date.parse(feed.updated_at) === Date.parse(mobile.generated_at)) {
                console.log(`Verified public snapshot ${mobile.sequence}`);
                process.exit(0);
              }
            } catch (error) { console.log(error.message); }
            await new Promise(resolve => setTimeout(resolve, 10000));
          }
          throw new Error('Public feed did not advance to the deployed snapshot');
          JS
